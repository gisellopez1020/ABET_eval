# Modo HTTPS (docker-compose.https.yml): nginx termina TLS y es la única entrada.
# El backend no se publica: el login con Google también pasa por /api/.
# Certificado y llave en ./certs (fullchain.pem y privkey.pem), montados en
# /etc/nginx/certs. Ver DESPLIEGUE_PRODUCCION.md.

server_tokens off;

# ── Límite de intentos (429) ────────────────────────────────────────────────
# Solo en el login con Google y en las subidas de archivos; el resto de la API y los
# archivos estáticos no tienen límite (la SPA hace muchas peticiones al navegar).
# La clave es la IP del cliente. Fuera de esas rutas la clave queda vacía y
# nginx no cuenta la petición. $uri ya viene decodificado y sin barras repetidas:
# /api/auth/%6Cogin o //api/auth/login cuentan igual.
map $uri $limite_login {
    ~^/api/auth/(login|callback)$  $binary_remote_addr;
    default                        "";
}
map "$request_method:$uri" $limite_subidas {
    ~^POST:/api/(secciones/[^/]+/estudiantes/(csv|vista-previa)|actividades/[^/]+/criterios/importar-excel|catalogo/ra-abet/importar)$  $binary_remote_addr;
    default  "";
}
# Login: 10 por minuto por IP, con ráfaga de 10 (un login normal son 2 peticiones:
# /login y /callback). Subidas: 20 por minuto, ráfaga de 10.
limit_req_zone $limite_login   zone=login:10m   rate=10r/m;
limit_req_zone $limite_subidas zone=subidas:10m rate=20r/m;
limit_req_status 429;
limit_req_log_level warn;

# Puerto 80: solo redirige a https (y no sirve nada más)
server {
    listen 80;
    listen [::]:80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    # TLS 1.2 y 1.3 solamente: TLS 1.0 y 1.1 (y SSL) se rechazan en el saludo
    ssl_protocols TLSv1.2 TLSv1.3;
    # TLS 1.2: solo intercambio ECDHE (secreto perfecto hacia adelante) y cifrados AEAD,
    # como el perfil "intermediate" de Mozilla. TLS 1.3 usa sus propios cifrados (todos AEAD).
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:TLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    include /etc/nginx/snippets/cabeceras-seguridad.conf;

    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    client_max_body_size 3m;

    # Healthcheck del contenedor (docker compose): solo desde dentro del contenedor.
    # $realip_remote_addr es la IP de la conexión TCP (nunca la de X-Forwarded-For).
    location = /nginx-salud {
        access_log off;
        if ($realip_remote_addr != "127.0.0.1") {
            return 404;
        }
        default_type text/plain;
        return 200 "ok";
    }

    location /api/ {
        limit_req zone=login   burst=10 nodelay;
        limit_req zone=subidas burst=10 nodelay;
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        # nginx es el borde: la IP del cliente es la de la conexión, no un
        # X-Forwarded-For que mande el propio cliente
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Archivos con hash en el nombre: pueden quedar en caché indefinidamente
    location /assets/ {
        include /etc/nginx/snippets/cabeceras-seguridad.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Rutas de React Router: si no es un archivo, index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
