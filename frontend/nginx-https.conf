# Modo HTTPS (docker-compose.https.yml): nginx termina TLS y es la única entrada.
# El backend no se publica: el login con Google también pasa por /api/.
# Certificado y llave en ./certs (fullchain.pem y privkey.pem), montados en
# /etc/nginx/certs. Ver DESPLIEGUE_PRODUCCION.md.

server_tokens off;

# Puerto 80: solo redirige a https (y no sirve nada más)
server {
    listen 80;
    listen [::]:80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    # TLS 1.2 y 1.3 solamente: TLS 1.0 y 1.1 (y SSL) se rechazan en el saludo
    ssl_protocols TLSv1.2 TLSv1.3;
    # TLS 1.2: solo intercambio ECDHE (secreto perfecto hacia adelante) y cifrados AEAD,
    # como el perfil "intermediate" de Mozilla. TLS 1.3 usa sus propios cifrados (todos AEAD).
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:TLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    include /etc/nginx/snippets/cabeceras-seguridad.conf;

    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    client_max_body_size 3m;

    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        # nginx es el borde: la IP del cliente es la de la conexión, no un
        # X-Forwarded-For que mande el propio cliente
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Archivos con hash en el nombre: pueden quedar en caché indefinidamente
    location /assets/ {
        include /etc/nginx/snippets/cabeceras-seguridad.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Rutas de React Router: si no es un archivo, index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
