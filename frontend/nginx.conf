# Frontend compilado + proxy a la API (instalación para usar, docker-compose.prod.yml).
# Reemplaza lo que en desarrollo hace el servidor de Vite (vite.config.ts, server.proxy).
server {
    listen 80;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    client_max_body_size 3m;

    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Archivos con hash en el nombre: pueden quedar en caché indefinidamente
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Rutas de React Router: si no es un archivo, index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
