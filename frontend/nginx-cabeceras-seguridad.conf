# Cabeceras de seguridad de los modos HTTPS y detrás de proxy (RNF-13).
# Se incluye en cada `server` y en cada `location` que tenga su propio add_header:
# nginx no hereda los add_header del nivel superior en un bloque que define alguno.

# HSTS: el navegador solo vuelve a este dominio por https durante un año. Sin
# includeSubDomains ni preload: no afecta a otros subdominios de la universidad.
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
# La app no se puede mostrar dentro de un frame de otro sitio (clickjacking)
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
# CSP probada recorriendo la app en Chrome (todas las pantallas, PDF y Excel): solo
# recursos del propio dominio. Dos excepciones, ambas por el PDF del reporte ABET:
# html2canvas inserta elementos <style> (style-src-elem 'unsafe-inline') y jsPDF usa
# imágenes data: (img-src data:). No se permite JavaScript en línea ni de otro dominio.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; style-src-elem 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
