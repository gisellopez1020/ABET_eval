services:
  postgres:
    # Mayor fija en 16: pasar a 17 exige volcar y restaurar el volumen (DESPLIEGUE_PRODUCCION.md)
    image: postgres:16.15-alpine3.24
    container_name: abet-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-abet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-abet_pass}
      POSTGRES_DB: ${POSTGRES_DB:-abet_eval}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-abet} -d ${POSTGRES_DB:-abet_eval}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      # Etapa con pytest (requirements-dev.txt); la de producción no lo trae
      target: dev
    container_name: abet-backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-abet}:${POSTGRES_PASSWORD:-abet_pass}@postgres:5432/${POSTGRES_DB:-abet_eval}}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-PLACEHOLDER}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-PLACEHOLDER}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:8000/auth/callback}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-PLACEHOLDER}
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:-PLACEHOLDER}
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:-PLACEHOLDER}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      FRONTEND_ORIGINS: ${FRONTEND_ORIGINS:-http://localhost:5173,http://frontend:5173}
      GOOGLE_DRIVE_FOLDER_NAME: ${GOOGLE_DRIVE_FOLDER_NAME:-ABET_Eval}
      SKIP_AUTH: ${SKIP_AUTH:-true}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-PLACEHOLDER}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8-flash}
      GEMINI_THINKING_LEVEL: ${GEMINI_THINKING_LEVEL:-low}
      SESION_INACTIVIDAD_MINUTOS: ${SESION_INACTIVIDAD_MINUTOS:-480}
      SESION_DURACION_MAXIMA_MINUTOS: ${SESION_DURACION_MAXIMA_MINUTOS:-1440}
      # Las pruebas que revisan .env.example y los docker-compose los leen de aquí
      ABET_RAIZ_REPO: /repo
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - /app/venv
      # Raíz del repo, solo lectura: para `docker-compose exec backend pytest`
      - ./:/repo:ro
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "alembic upgrade head && python -m app.verificar_cifrado && exec uvicorn main:app --host 0.0.0.0 --port 8000 --reload"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: abet-frontend
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
      VITE_API_PROXY_TARGET: http://backend:8000
      VITE_SKIP_AUTH: ${SKIP_AUTH:-true}
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    command: npm run dev -- --host 0.0.0.0

volumes:
  postgres_data:
