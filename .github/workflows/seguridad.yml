# Auditoría semanal de vulnerabilidades conocidas en las dependencias de producción.
#
# No corre en los Pull Request ni forma parte de `ci-ok`: depende de bases de datos de
# vulnerabilidades externas que cambian solas, y una CVE nueva pondría en rojo un PR
# que no tocó dependencias. Si falla, GitHub avisa por correo; la corrección llega con
# Dependabot (security updates) o a mano.
# Ojo: en un repo público, GitHub desactiva los `schedule` tras 60 días sin actividad.
name: Seguridad

on:
  schedule:
    - cron: "17 6 * * 1" # lunes 06:17 UTC (01:17 en Colombia)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pip-audit:
    name: pip-audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Instalar pip-audit
        run: python -m pip install pip-audit==2.10.1

      # Solo lo que va en la imagen de producción (sin pytest ni herramientas de desarrollo)
      - name: Auditar backend/requirements.txt
        run: pip-audit --requirement backend/requirements.txt --desc on

  npm-audit:
    name: npm-audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.nvmrc

      # Solo dependencias de producción (las que acaban en el bundle) y desde severidad alta.
      # Lee package-lock.json: no hace falta instalar nada
      - name: Auditar dependencias de producción
        run: npm audit --omit=dev --audit-level=high
